name: Hyperswitch
options:
  deploymentTarget:
    iOS: "15.1"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    # frameworkgen/build.sh passes the SDK version (hyperswitchSDK/Shared/Version.swift).
    HYPERSWITCH_VERSION: 0.0.0-dev

fileGroups:
  - hyperswitchSDK/Include

targetTemplates:
  # A framework that ships as an xcframework.
  SDKFramework:
    type: framework
    platform: iOS
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: io.hyperswitch.sdk.$(TARGET_NAME)
        MARKETING_VERSION: $(HYPERSWITCH_VERSION)
        GENERATE_INFOPLIST_FILE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
        ENABLE_MODULE_VERIFIER: NO
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        # The frameworks are one Swift package: `package` declarations are visible between
        # them and to nothing else.
        SWIFT_PACKAGE_NAME: HyperswitchSDK
        # The generated <Module>-Swift.h serves only the framework's own ObjC++ (TurboModules,
        # Fabric views): it lists internal @objc declarations too and is never installed. The
        # frameworks' public API is Swift only. (swift-driver accepts but does not forward
        # -emit-clang-header-min-access, hence -Xfrontend.)
        SWIFT_INSTALL_OBJC_HEADER: NO
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -emit-clang-header-min-access -Xfrontend internal -alias-module-names-in-module-interface"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/hyperswitchSDK/Include"
  # An SDK that runs on React Native: payments, payment methods, payment method management.
  ReactNativeSDK:
    templates: [SDKFramework]
    dependencies:
      - target: HyperswitchShared
        embed: false
      - target: HyperswitchReactNative
        embed: false
  # A React Native plugin: the plugin's pods (see the Podfile) linked into a framework of its
  # own, for whichever SDK runs its JS.
  PluginFramework:
    templates: [SDKFramework]
    sources:
      - path: hyperswitchSDK/Plugins/PluginAnchor.swift
    dependencies:
      - target: HyperswitchReactNative
        embed: false
  # A framework that builds on HyperswitchShared alone, without React Native.
  SharedFramework:
    templates: [SDKFramework]
    dependencies:
      - target: HyperswitchShared
        embed: false

targets:
  # The public entry points (Hyperswitch, the configurations, PaymentSession, ...) and what
  # every SDK shares: networking, logging.
  HyperswitchShared:
    templates: [SDKFramework]
    sources: [hyperswitchSDK/Shared]

  # React Native and what every SDK running on it needs: the React host plumbing, all codegen,
  # and the React Native packages all their JS uses.
  HyperswitchReactNative:
    templates: [SDKFramework]
    sources: [hyperswitchSDK/ReactNative]
    dependencies:
      - target: HyperswitchShared
        embed: false
    settings:
      base:
        # Codegen output lives in the ReactCodegen static library, and this framework links all
        # of it for every framework built on it: Fabric component descriptors are plain C++ that
        # -ObjC would not pull in from the archive.
        OTHER_LDFLAGS: '$(inherited) -force_load "$(PODS_CONFIGURATION_BUILD_DIR)/ReactCodegen/libReactCodegen.a"'

  # Payments: payment sheet, widgets, headless.
  Hyperswitch:
    templates: [ReactNativeSDK]
    sources:
      - path: hyperswitchSDK/Core
        headerVisibility: project
        excludes: ["Resources/**"]
      - path: hyperswitchSDK/Core/Resources/hyperswitch.bundle
        buildPhase: resources
      - path: hyperswitchSDK/PrivacyInfo.xcprivacy
        buildPhase: resources

  HyperswitchPaymentMethods:
    templates: [ReactNativeSDK]
    sources:
      - path: hyperswitchSDK/PaymentMethods
        headerVisibility: project
        excludes: ["Resources/**"]
      - path: hyperswitchSDK/PaymentMethods/Resources/hyperswitch-payment-methods.bundle
        buildPhase: resources
      - path: hyperswitchSDK/PrivacyInfo.xcprivacy
        buildPhase: resources

  HyperswitchPaymentMethodManagement:
    templates: [ReactNativeSDK]
    sources:
      - path: hyperswitchSDK/PaymentMethodManagement
        headerVisibility: project
        excludes: ["Resources/**"]
      - path: hyperswitchSDK/PaymentMethodManagement/Resources/hyperswitch-payment-method-management.bundle
        buildPhase: resources
      - path: hyperswitchSDK/PrivacyInfo.xcprivacy
        buildPhase: resources

  HyperswitchScanCardPlugin:
    templates: [PluginFramework]
    sources: [{ path: hyperswitchSDK/PrivacyInfo.xcprivacy, buildPhase: resources }]
  HyperswitchNetcetera3DSPlugin:
    templates: [PluginFramework]
    sources: [{ path: hyperswitchSDK/PrivacyInfo.xcprivacy, buildPhase: resources }]
  HyperswitchPayPalPlugin:
    templates: [PluginFramework]
    sources: [{ path: hyperswitchSDK/PrivacyInfo.xcprivacy, buildPhase: resources }]
  HyperswitchSentryPlugin:
    templates: [PluginFramework]
    # Sentry is linked in statically, so its privacy manifest ships with this framework; the
    # frameworkgen guards check it still matches the Sentry build RNSentry links.
    sources: [{ path: hyperswitchSDK/Plugins/Sentry/PrivacyInfo.xcprivacy, buildPhase: resources }]

  HyperswitchAirbornePlugin:
    templates: [SharedFramework]
    sources:
      - path: hyperswitchSDK/Plugins/Airborne
      - path: hyperswitchSDK/PrivacyInfo.xcprivacy
        buildPhase: resources

  HyperswitchLite:
    templates: [SharedFramework]
    sources:
      - path: hyperswitchSDK/CoreLite
      - path: hyperswitchSDK/PrivacyInfo.xcprivacy
        buildPhase: resources

  HyperswitchLiteScanCard:
    templates: [SharedFramework]
    sources:
      - path: hyperswitchSDK/LitePlugins/ScanCard
      - path: hyperswitchSDK/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: HyperswitchLite
        embed: false
      # Staged by frameworkgen/build.sh bootstrap from what the ScanCard plugin links
      # (products.yml `binaries`).
      - framework: build/vendor/HyperswitchScanCard.xcframework
        embed: false

  HyperswitchAuthentication:
    templates: [SharedFramework]
    sources:
      - path: hyperswitchSDK/AuthenticationModule
      - path: hyperswitchSDK/PrivacyInfo.xcprivacy
        buildPhase: resources

  HyperswitchAuthenticationNetcetera3DS:
    templates: [SharedFramework]
    sources:
      - path: hyperswitchSDK/AuthenticationProviders/Netcetera3DS
      - path: hyperswitchSDK/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: HyperswitchAuthentication
        embed: false
      # Staged by frameworkgen/build.sh bootstrap from what the Netcetera plugin links
      # (products.yml `binaries`).
      - framework: build/vendor/ThreeDS_SDK.xcframework
        embed: false

  # Links Trident through its pod (see the Podfile).
  HyperswitchAuthenticationTrident3DS:
    templates: [SharedFramework]
    sources:
      - path: hyperswitchSDK/AuthenticationProviders/Trident3DS
      - path: hyperswitchSDK/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: HyperswitchAuthentication
        embed: false

  HyperswitchDemo:
    type: application
    platform: iOS
    sources:
      - path: hyperswitch
        excludes: ["Info.plist", "hyperswitch.entitlements"]
    dependencies:
      - target: HyperswitchShared
      - target: HyperswitchReactNative
      - target: Hyperswitch
      - target: HyperswitchPaymentMethods
      - target: HyperswitchPaymentMethodManagement
      - target: HyperswitchAirbornePlugin
      - target: HyperswitchAuthentication
      - target: HyperswitchAuthenticationNetcetera3DS
      - target: HyperswitchAuthenticationTrident3DS
      - target: HyperswitchDemoAppClip
    settings:
      base:
        # hyperswitch.app, as Detox expects; the module needs a name that differs from the
        # Hyperswitch framework's in more than case.
        PRODUCT_NAME: hyperswitch
        PRODUCT_MODULE_NAME: HyperswitchDemo
        PRODUCT_BUNDLE_IDENTIFIER: io.hyperswitch
        INFOPLIST_FILE: hyperswitch/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HyperSwitch
        INFOPLIST_KEY_NSCameraUsageDescription: for scanning card
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: hyperswitch/hyperswitch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: '"hyperswitch/Preview Content"'
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"

  HyperswitchDemoAppClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: hyperswitchAppClip
        excludes: ["Info.plist", "hyperswitchAppClip.entitlements"]
      - hyperswitch/HyperViewModel.swift
      - hyperswitch/NetworkUtils.swift
    dependencies:
      - target: HyperswitchShared
      - target: HyperswitchLite
      - target: HyperswitchLiteScanCard
      - framework: build/vendor/HyperswitchScanCard.xcframework
    settings:
      base:
        PRODUCT_NAME: hyperswitchAppClip
        PRODUCT_BUNDLE_IDENTIFIER: io.hyperswitch.Clip
        INFOPLIST_FILE: hyperswitchAppClip/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: hyperswitch
        INFOPLIST_KEY_NSCameraUsageDescription: for scanning card
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: hyperswitchAppClip/hyperswitchAppClip.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPCLIP"
        MARKETING_VERSION: "1.0"

schemes:
  # Every shipped framework; frameworkgen archives this scheme.
  HyperswitchSDK:
    build:
      targets:
        HyperswitchShared: all
        HyperswitchReactNative: all
        Hyperswitch: all
        HyperswitchPaymentMethods: all
        HyperswitchPaymentMethodManagement: all
        HyperswitchScanCardPlugin: all
        HyperswitchNetcetera3DSPlugin: all
        HyperswitchPayPalPlugin: all
        HyperswitchSentryPlugin: all
        HyperswitchAirbornePlugin: all
        HyperswitchLite: all
        HyperswitchLiteScanCard: all
        HyperswitchAuthentication: all
        HyperswitchAuthenticationNetcetera3DS: all
        HyperswitchAuthenticationTrident3DS: all
    archive:
      config: Release
  HyperswitchDemo:
    build:
      targets:
        HyperswitchDemo: all
    run:
      config: Debug
    archive:
      config: Release
